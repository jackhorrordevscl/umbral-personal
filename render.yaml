services:
  - type: web
    name: umbral-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev es necesario a pesar de NODE_ENV=production (env var de
    # abajo): Render aplica esa env var también durante el build, y con
    # NODE_ENV=production npm salta devDependencies por defecto -- ahí vive
    # @nestjs/cli, que provee el comando `nest` que usa `npm run build`. Sin
    # este flag, el build falla con "nest: not found" aunque en local (sin
    # NODE_ENV seteada) funcione perfecto.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # prisma migrate deploy corre ANTES de levantar el server (nunca contra
    # tráfico real en el medio); main.ts además corre migraciones de forma
    # async si RUN_MIGRATIONS=true, como red de seguridad para plataformas
    # cuyo Start Command no las corriera por su cuenta -- acá sí las corre,
    # así que RUN_MIGRATIONS puede quedar en false.
    startCommand: npx prisma migrate deploy && npm run start:prod
    # setGlobalPrefix('api/v1') en main.ts hace que "/" no tenga ninguna ruta
    # registrada (404) -- el health check debe pegarle al prefijo real.
    healthCheckPath: /api/v1
    envVars:
      # Secretos/config específicos de esta instancia: se cargan a mano en
      # el dashboard de Render la primera vez (nunca en este archivo, que es
      # público en el repo). Ver checklist en README.md.
      # Transaction pooler (puerto 6543, con ?pgbouncer=true). Ver checklist
      # en README.md para la string exacta de Supabase.
      - key: DATABASE_URL
        sync: false
      # Session pooler (puerto 5432), NO el host "Direct connection" de
      # Supabase -- ese resuelve solo por IPv6 y Render no tiene salida
      # IPv6, así que prisma migrate deploy nunca lo alcanza (issue #11).
      # El Session pooler es IPv4 y soporta prepared statements.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Issue #170: Render (plan free) no tiene disco persistente -- los
      # avatares se perdían en cada deploy. Storage migrado a Backblaze B2
      # (bucket "umbral-avatars", privado, región us-west-004). Endpoint y
      # región no son secretos pero se cargan igual sin valor acá para no
      # repetir por accidente un bucket/región distinto al de producción;
      # keyID/applicationKey si son secretos. Ver checklist en README.md.
      - key: B2_AVATARS_ENDPOINT
        sync: false
      - key: B2_AVATARS_REGION
        sync: false
      - key: B2_AVATARS_BUCKET
        sync: false
      - key: B2_AVATARS_KEY_ID
        sync: false
      - key: B2_AVATARS_APPLICATION_KEY
        sync: false
      # Issue #191: error tracking (Sentry). Opcional -- sin DSN el SDK queda
      # desactivado. Se carga a mano en el dashboard (proyecto Node de Sentry).
      - key: SENTRY_DSN
        sync: false
      # Config no secreta, con el mismo valor en cada deploy: fija acá para
      # no tener que repetirla a mano en el dashboard.
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: MFA_APP_NAME
        value: Umbral - RCE
      - key: RUN_MIGRATIONS
        value: "false"
      # 3 = Render detrás de Cloudflare (ver comentario en auth.module.ts).
      # Si el deploy real no tiene Cloudflare delante, esto debe bajar a 1.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
