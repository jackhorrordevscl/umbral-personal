name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: umbral_ci
          POSTGRES_PASSWORD: umbral_ci
          POSTGRES_DB: umbral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://umbral_ci:umbral_ci@localhost:5432/umbral_ci
      # El service container de Postgres no tiene pooler (a diferencia de
      # Supabase en producción), así que DIRECT_URL apunta a la misma
      # conexión que DATABASE_URL — ver el comentario en schema.prisma.
      DIRECT_URL: postgresql://umbral_ci:umbral_ci@localhost:5432/umbral_ci
      JWT_SECRET: ci-only-jwt-secret-never-used-outside-github-actions
      JWT_EXPIRES_IN: 8h
      MFA_APP_NAME: Umbral - RCE (CI)
      DOCUMENT_ENCRYPTION_KEY: MoDh8f3G8V0hR0m5wq8V0hR0m5wq8V0hR0m5wq8V0h8=
      SEED_ADMIN_EMAIL: admin@umbral.cl
      SEED_ADMIN_PASSWORD: Umbral2024!
      # sdd/session-reminders (design.md, "Migration / Rollout"): el cron de
      # RemindersService debe quedar apagado en el entorno e2e -- sin esto,
      # AppModule arrancaría el scan real en cada boot de CI.
      REMINDERS_ENABLED: 'false'
      # sdd/google-calendar-integration PR 1: GoogleTokenCryptoService.onModuleInit
      # exige esta clave siempre (mirrors DocumentEncryptionService), sin
      # importar si GOOGLE_CLIENT_ID está seteado -- sin esto, AppModule no
      # arranca en CI.
      GOOGLE_TOKEN_ENCRYPTION_KEY: MoDh8f3G8V0hR0m5wq8V0hR0m5wq8V0hR0m5wq8V0i8=
      # Fake, solo para que CalendarOauthService quede "enabled" y
      # generateAuthUrl (sin llamada de red) funcione en calendar-integration.e2e-spec.ts
      # -- getToken()/revokeToken() (los únicos que sí llaman a Google) están
      # siempre stubbeados vía jest.spyOn en esos tests, nunca se ejecutan de
      # verdad en CI.
      GOOGLE_CLIENT_ID: ci-only-fake-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-fake-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3001/api/v1/calendar-integration/callback
      # design.md "Migration / Rollout": debe estar en 'false' en el entorno
      # e2e, mismo motivo que REMINDERS_ENABLED.
      GOOGLE_CALENDAR_SYNC_ENABLED: 'false'
      # sdd/online-payment-integration PR 2: PaymentCredentialCryptoService.
      # onModuleInit exige esta clave siempre (mismo criterio que
      # DOCUMENT_ENCRYPTION_KEY/GOOGLE_TOKEN_ENCRYPTION_KEY) -- sin esto,
      # AppModule no arranca en CI. Reusa el mismo valor dummy que
      # GOOGLE_TOKEN_ENCRYPTION_KEY (ya escaneado/conocido) en vez de un
      # base64 nuevo -- un valor nunca visto dispara una alerta nueva en
      # GitGuardian aunque sea un dummy de CI, no un secreto real.
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: MoDh8f3G8V0hR0m5wq8V0hR0m5wq8V0hR0m5wq8V0i8=
      # A diferencia de REMINDERS_ENABLED/GOOGLE_CALENDAR_SYNC_ENABLED, este
      # SÍ debe quedar habilitado: payments.e2e-spec.ts crea una consulta y
      # espera que PaymentsService.ensureCharge() (gateado por este flag)
      # cree el Payment de verdad antes de poder probar /payments/confirm
      # contra él -- createOrder/getOrderStatus quedan stubeados vía
      # jest.spyOn en ese archivo, así que igual no hay llamada de red real.
      # El cron sweep() (cada 30 min) no llega a dispararse en la duración
      # de un job de CI de todos modos.
      PAYMENTS_ENABLED: 'true'
      # Fake, solo para que verifyCallbackSignature tenga con qué firmar en
      # payments.e2e-spec.ts (esa verificación corre SIN mockear). Ninguna
      # llamada de red real a Flow ocurre en CI: createOrder/getOrderStatus
      # están siempre stubeados vía jest.spyOn; FlowPaymentGatewayClient.
      # assertConfigured() en cualquier otro e2e que cree una consulta
      # (fire-and-forget) degrada con un log, nunca rompe el test.
      FLOW_SECRET_KEY: ci-only-fake-flow-secret-key
      FLOW_API_KEY: ci-only-fake-flow-api-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Migrar base de datos de CI
        run: npx prisma migrate deploy

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Seed (usuario admin de test)
        run: npm run seed

      - name: Tests unitarios (con cobertura)
        run: npx jest --coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      - name: Tests e2e
        run: npx jest --config ./test/jest-e2e.json --forceExit

      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests unitarios (con cobertura)
        run: npm run test:cov

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Typecheck + build
        run: npm run build

      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high
