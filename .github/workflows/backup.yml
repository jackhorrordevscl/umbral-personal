name: Backup offsite

# Issue #8: este repo corre el backend en Render free tier, que no tiene un
# proceso persistente para cron, así que el backup no puede vivir en un
# script local con estado (issue #61, retirado: asumía una VM propia con
# rutas locales tipo BACKUP_DIR/ARCHIVE_DIR/NAS_DIR que no tienen sentido en
# un runner efímero). Este workflow corre pg_dump contra Supabase
# (accesible desde cualquier lado, no requiere estar en la misma red),
# cifra el resultado y lo sube a Backblaze B2 vía rclone -- cada backup
# diario se sube sin acumular estado local entre corridas.
on:
  schedule:
    # 05:00 UTC ~ 02:00 America/Santiago en horario de verano (UTC-3); se
    # corre ~1h más tarde en horario de invierno (UTC-4) -- no es crítico
    # para un backup nocturno.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Antes de que B2 esté configurado (secrets vacíos), el job fallaba
      # todas las noches en vez de terminar limpio: rclone/pg_dump reventaban
      # con un error de credenciales en vez de un mensaje claro. Este chequeo
      # corta antes de instalar nada y termina en success con un aviso, para
      # no generar una alerta roja diaria por algo que ya se sabe pendiente.
      - name: Verificar secrets de B2 configurados
        id: check-secrets
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          B2_BUCKET_PATH: ${{ secrets.B2_BUCKET_PATH }}
        run: |
          if [ -z "$BACKUP_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ] || \
             [ -z "$RCLONE_CONFIG_CONTENT" ] || [ -z "$B2_BUCKET_PATH" ]; then
            echo "⚠️ Backup offsite salteado: faltan uno o más secrets de B2 (BACKUP_DB_URL, BACKUP_PASSPHRASE, RCLONE_CONFIG_CONTENT, B2_BUCKET_PATH). Ver issue #8/#17." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Antes se instalaba con `curl | sudo bash` (script sin checksum ni
      # firma) en el mismo job que maneja RCLONE_CONFIG_CONTENT y las
      # credenciales de B2 -- un compromiso de ese script de instalación
      # tendría acceso de escritura al destino de backup (issue #71). Ahora
      # se baja un release fijado y se verifica su SHA256 contra el
      # SHA256SUMS publicado por rclone.org antes de instalar nada.
      - name: Instalar rclone (versión fijada + checksum verificado)
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          # NO llamar esto RCLONE_VERSION: el binario rclone mapea
          # automáticamente cualquier env var RCLONE_<FLAG> a su flag
          # equivalente, y --version es un flag booleano -- con
          # RCLONE_VERSION=1.75.0 seteada, `rclone version` fallaba con
          # "strconv.ParseBool: parsing \"1.75.0\": invalid syntax" (ver
          # incidente de los runs fallidos de 2026-08-04/05).
          PINNED_RCLONE_VERSION: '1.75.0'
        run: |
          set -euo pipefail

          ARCHIVE="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL -o "$ARCHIVE" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/${ARCHIVE}"
          curl -fsSL -o SHA256SUMS "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/SHA256SUMS"
          grep " ${ARCHIVE}\$" SHA256SUMS | sha256sum -c -

          unzip -q "$ARCHIVE"
          sudo install -m 755 "rclone-v${PINNED_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf "$ARCHIVE" SHA256SUMS "rclone-v${PINNED_RCLONE_VERSION}-linux-amd64"
          rclone version

      - name: Backup cifrado -> Backblaze B2
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          # Session pooler de Supabase (DIRECT_URL en Render), no el
          # transaction pooler: pg_dump necesita prepared statements igual
          # que prisma migrate deploy -- ver comentario en schema.prisma.
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          B2_BUCKET_PATH: ${{ secrets.B2_BUCKET_PATH }}
        run: |
          set -euo pipefail

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

          PASSPHRASE_FILE="$(mktemp)"
          printf '%s' "$BACKUP_PASSPHRASE" > "$PASSPHRASE_FILE"
          chmod 600 "$PASSPHRASE_FILE"

          DATE="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="umbral_backup_${DATE}.sql.gz.enc"

          # pg_dump vía docker: garantiza una versión de cliente compatible
          # con el server de Supabase sin depender del paquete que traiga el
          # runner de GitHub Actions. pg_dump rechaza volcar un server MÁS
          # NUEVO que su propia versión ("aborting because of server version
          # mismatch") -- Supabase corre Postgres 17.x, así que el cliente
          # tiene que ser >= 17, no 16.
          docker run --rm postgres:17-alpine pg_dump "$BACKUP_DB_URL" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass "file:$PASSPHRASE_FILE" \
            > "$BACKUP_FILE"

          # --no-check-dest: la key de B2 usada acá es write-only (solo
          # listFiles+writeFiles, sin readFiles) por diseño (issue #58) --
          # sin este flag, rclone intenta un HEAD al endpoint de descarga
          # para chequear si el destino ya existe, y esa key no tiene
          # permiso para eso (401).
          rclone copy --no-check-dest "$BACKUP_FILE" "$B2_BUCKET_PATH"

          rm -f "$PASSPHRASE_FILE" "$BACKUP_FILE"
          echo "✅ Backup subido a $B2_BUCKET_PATH/$BACKUP_FILE"
