# LOCAL DEVELOPMENT ONLY.
# The credentials below are public example values. Do not reuse this file in
# staging, shared or production environments; use managed secrets instead.
services:
  postgres:
    image: postgres:16
    container_name: umbral-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbral_user
      POSTGRES_PASSWORD: umbral_local_dev
      POSTGRES_DB: umbral_db
    ports:
      # Bound to loopback so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - umbral_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbral_user -d umbral_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umbral_postgres_data:
